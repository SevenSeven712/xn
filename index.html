<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROBLOX</title>
<style>
  :root {
    --blue: #00a2ff;
    --dark: #232527;
    --gray: #6b6b75;
    --line: #e3e3e8;
    --bg: #f7f7f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* ==================== 登录页 ==================== */
  #loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #fff;
  }
  .login-card { width: 100%; max-width: 380px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand svg { width: 44px; height: 44px; display: block; }
  .brand span {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    font-style: italic;
  }
  .login-card h1 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 22px;
  }
  .field { margin-bottom: 12px; }
  .field input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f7f7f8;
    color: var(--dark);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .field input:focus { border-color: var(--blue); background: #fff; }
  .btn-login {
    width: 100%;
    height: 48px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    background: var(--dark);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    transition: opacity .15s;
  }
  .btn-login:hover { opacity: .88; }
  .btn-login:disabled { opacity: .6; cursor: default; }
  .hint {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--gray);
    line-height: 1.7;
  }

  /* ==================== 主页 ==================== */
  #homePage { min-height: 100vh; background: var(--bg); }
  .topbar {
    height: 56px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .brand { margin: 0; gap: 8px; }
  .topbar .brand svg { width: 28px; height: 28px; }
  .topbar .brand span { font-size: 17px; letter-spacing: 1px; }
  .search { flex: 1; max-width: 420px; position: relative; }
  .search input {
    width: 100%;
    height: 36px;
    padding: 0 14px 0 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f2f2f5;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .search::before {
    content: "🔍";
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: .55;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    margin-left: auto;
    flex: 0 0 auto;
  }
  .content { padding: 26px 20px 60px; max-width: 1080px; margin: 0 auto; }
  .section-title { font-size: 17px; font-weight: 700; margin: 0 0 14px; }

  .card-link {
    display: block;
    width: 100%;
    max-width: 240px;
    text-decoration: none;
    color: inherit;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    border: 1px solid var(--line);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .10);
  }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #ececf0;
    overflow: hidden;
  }
  /* 永不消失的骨架屏 */
  .skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, #e6e6ea 15%, #f6f6f9 40%, #e6e6ea 65%);
    background-size: 220% 100%;
    animation: shimmer 1.5s linear infinite;
  }
  @keyframes shimmer {
    from { background-position: 160% 0; }
    to   { background-position: -60% 0; }
  }
  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
  .card-sub { font-size: 12px; color: var(--gray); }

  @media (max-width: 480px) {
    .card-link { max-width: 100%; }
    .topbar { gap: 10px; padding: 0 14px; }
    .topbar .search { display: none; }
  }
</style>
</head>
<body>

  <!-- ==================== 登录页 ==================== -->
  <div id="loginPage">
    <div class="login-card">
      <div class="brand">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g transform="rotate(-15 50 50)">
            <rect x="18" y="18" width="64" height="64" rx="14" fill="#00a2ff" />
            <rect x="41" y="41" width="18" height="18" rx="4" fill="#fff" />
          </g>
        </svg>
        <span>ROBLOX</span>
      </div>
      <h1>登录</h1>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <input id="username" type="text" placeholder="用户名或邮箱" />
        </div>
        <div class="field">
          <input id="password" type="password" placeholder="密码" />
        </div>
        <button class="btn-login" id="loginBtn" type="submit">登录</button>
      </form>
      <p class="hint">未注册会自动登录（你所在的地区网速较慢已自动加速）</p>
    </div>
  </div>

  <!-- ==================== 主页 ==================== -->
  <div id="homePage" class="hidden">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g transform="rotate(-15 50 50)">
            <rect x="18" y="18" width="64" height="64" rx="14" fill="#00a2ff" />
            <rect x="41" y="41" width="18" height="18" rx="4" fill="#fff" />
          </g>
        </svg>
        <span>ROBLOX</span>
      </div>
      <div class="search">
        <input type="text" placeholder="搜索" />
      </div>
      <div class="avatar">U</div>
    </header>

    <main class="content">
      <h2 class="section-title">继续游玩</h2>

      <a class="card-link" href="https://liuyanban.de5.net/posts.html">
        <div class="thumb">
          <div class="skeleton"></div>
        </div>
        <div class="card-body">
          <p class="card-title">餐厅大亨</p>
          <p class="card-sub">加载中…</p>
        </div>
      </a>
    </main>
  </div>

<script>
  (function () {
    var loginForm = document.getElementById("loginForm");
    var loginBtn = document.getElementById("loginBtn");
    var loginPage = document.getElementById("loginPage");
    var homePage = document.getElementById("homePage");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      if (loginBtn.disabled) return;

      // 不读取、不发送、不存储任何输入内容
      loginBtn.disabled = true;
      loginBtn.textContent = "登录中…";

      setTimeout(function () {
        loginPage.classList.add("hidden");
        homePage.classList.remove("hidden");
        window.scrollTo(0, 0);
      }, 1100);
    });
  })();
</script>
</body>
</html>
