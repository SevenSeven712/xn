<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ROBLOX</title>
<style>
  :root {
    --blue: #00a2ff;
    --dark: #232527;
    --gray: #6b6b75;
    --line: #e3e3e8;
    --bg: #f7f7f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* ==================== 登录页 ==================== */
  #loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #fff;
  }
  .login-card { width: 100%; max-width: 380px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand svg { width: 44px; height: 44px; display: block; }
  .brand span {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    font-style: italic;
  }
  .login-card h1 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 22px;
  }
  .field { margin-bottom: 12px; }
  .field input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f7f7f8;
    color: var(--dark);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .field input:focus { border-color: var(--blue); background: #fff; }
  .btn-login {
    width: 100%;
    height: 48px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    background: var(--dark);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    transition: opacity .15s;
  }
  .btn-login:hover { opacity: .88; }
  .btn-login:disabled { opacity: .6; cursor: default; }
  .hint {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--gray);
    line-height: 1.7;
  }

  /* ==================== 主页 ==================== */
  #homePage { min-height: 100vh; background: var(--bg); }
  .topbar {
    height: 56px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .brand { margin: 0; gap: 8px; }
  .topbar .brand svg { width: 28px; height: 28px; }
  .topbar .brand span { font-size: 17px; letter-spacing: 1px; }
  .search { flex: 1; max-width: 420px; position: relative; }
  .search input {
    width: 100%;
    height: 36px;
    padding: 0 14px 0 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f2f2f5;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .search::before {
    content: "🔍";
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: .55;
  }
  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    margin-left: auto;
    flex: 0 0 auto;
  }
  .content { padding: 26px 20px 60px; max-width: 1080px; margin: 0 auto; }
  .section-title { font-size: 17px; font-weight: 700; margin: 0 0 14px; }

  /* 单个卡片 */
  .card-link {
    display: block;
    width: 100%;
    max-width: 240px;
    text-decoration: none;
    color: inherit;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    border: 1px solid var(--line);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 26px rgba(0, 0, 0, .10);
  }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #ececf0;
    overflow: hidden;
  }
  /* 永不消失的骨架屏 */
  .skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, #e6e6ea 15%, #f6f6f9 40%, #e6e6ea 65%);
    background-size: 220% 100%;
    animation: shimmer 1.5s linear infinite;
  }
  @keyframes shimmer {
    from { background-position: 160% 0; }
    to   { background-position: -60% 0; }
  }
  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 14px; font-weight: 700; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { font-size: 12px; color: var(--gray); }

  /* 100 个游戏的网格布局 */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  /* 覆盖网格内的卡片宽度限制 */
  .game-grid .card-link { max-width: none; }

  @media (max-width: 480px) {
    .game-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .topbar { gap: 10px; padding: 0 14px; }
    .topbar .search { display: none; }
  }
</style>
</head>
<body>

  <!-- ==================== 登录页 ==================== -->
  <div id="loginPage">
    <div class="login-card">
      <div class="brand">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g transform="rotate(-15 50 50)">
            <rect x="18" y="18" width="64" height="64" rx="14" fill="#00a2ff" />
            <rect x="41" y="41" width="18" height="18" rx="4" fill="#fff" />
          </g>
        </svg>
        <span>ROBLOX</span>
      </div>
      <h1>登录</h1>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <input id="username" type="text" placeholder="用户名或邮箱" />
        </div>
        <div class="field">
          <input id="password" type="password" placeholder="密码" />
        </div>
        <button class="btn-login" id="loginBtn" type="submit">登录</button>
      </form>
      <p class="hint">本页面为本地演示，不会提交或保存任何内容</p>
    </div>
  </div>

  <!-- ==================== 主页 ==================== -->
  <div id="homePage" class="hidden">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <g transform="rotate(-15 50 50)">
            <rect x="18" y="18" width="64" height="64" rx="14" fill="#00a2ff" />
            <rect x="41" y="41" width="18" height="18" rx="4" fill="#fff" />
          </g>
        </svg>
        <span>ROBLOX</span>
      </div>
      <div class="search">
        <input type="text" placeholder="搜索" />
      </div>
      <div class="avatar">U</div>
    </header>

    <main class="content">
      <!-- 继续游玩 -->
      <h2 class="section-title">继续游玩</h2>
      <a class="card-link" href="https://liuyanban.de5.net/posts.html">
        <div class="thumb">
          <div class="skeleton"></div>
        </div>
        <div class="card-body">
          <p class="card-title">餐厅大亨</p>
          <p class="card-sub">加载中…</p>
        </div>
      </a>

      <!-- 为你推荐 (100 个游戏) -->
      <h2 class="section-title" style="margin-top: 36px;">为你推荐</h2>
      <div class="game-grid" id="gameGrid">
        <!-- 由 JS 自动生成 100 个虚拟游戏卡片 -->
      </div>
    </main>
  </div>

<script>
  // 1. 登录逻辑
  (function () {
    var loginForm = document.getElementById("loginForm");
    var loginBtn = document.getElementById("loginBtn");
    var loginPage = document.getElementById("loginPage");
    var homePage = document.getElementById("homePage");

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      if (loginBtn.disabled) return;
      loginBtn.disabled = true;
      loginBtn.textContent = "登录中…";

      setTimeout(function () {
        loginPage.classList.add("hidden");
        homePage.classList.remove("hidden");
        window.scrollTo(0, 0);
      }, 1100);
    });
  })();

  // 2. 生成 100 个虚拟游戏
  (function() {
    const gameNames = [
      "Adopt Me!", "Tower of Hell", "Brookhaven RP", "Blox Fruits", "Piggy", 
      "Doors", "Arsenal", "Bedwars", "Bloxburg", "Da Hood", 
      "Slap Battles", "Pet Simulator X", "Rainbow Friends", "Royale High", "Murder Mystery 2", 
      "Jailbreak", "MeepCity", "Bee Swarm Simulator", "Anime Adventures", "Doomspire Brickbattle",
      "Natural Disaster Survival", "Work at a Pizza Place", "Flee the Facility", "Tycoon", "Obby", 
      "Parkour", "The Mimic", "Evade", "Scary Sushi", "Sonic.exe", 
      "Rate My Avatar", "Pls Donate", "Item Asylum", "Combat Warriors", "Criminality", 
      "Deepwoken", "GPO", "Jujutsu Shenanigans", "A Dusty Trip", "Drive World", 
      "Greenville", "Southwest Florida", "Emergency Response", "Ro-Ghoul", "Demon Slayer RPG 2", 
      "Project Slayers", "Anime Last Stand", "All Star Tower", "Tower Defense", "Ninja Legends", 
      "Clicker Simulator", "Mining Simulator", "Treasure Quest", "Islands", "Skyblock", 
      "Hyperspace", "Starving Artists", "Free Draw", "Speed Run 4", "Flood Escape 2", 
      "Epic Minigames", "Robeats", "Funky Friday", "Friday Night Bloxxin", "Rhythm Masters", 
      "Livetopia", "Berry Avenue", "Neighborhood RP", "Club Iris", "Sakura High", 
      "Mansion RP", "PLS DONATE", "Anime Vanguards", "Arm Wrestle Simulator", "Steal a Brainrot", 
      "Grow a Garden", "Squid Game", "Squid Game X", "Squid Game Tycoon", "Hunter Exam", 
      "Project Mugetsu", "Type Soul", "Peroxide", "Heroes Online", "Anime Battle Arena", 
      "Anime Fighting Simulator", "Rarity Hunt", "Mining Tycoon", "Theme Park Tycoon 2", "Restaurant Tycoon 2", 
      "Retail Tycoon 2", "Airport Tycoon", "City Tycoon", "Zoo Tycoon", "Aquarium Tycoon", 
      "Lumber Tycoon 2", "Pizza Tycoon", "Grocery Tycoon", "Hotel Tycoon", "Farm Tycoon"
    ];

    const grid = document.getElementById("gameGrid");
    if (!grid) return;

    // 循环生成 100 个卡片
    gameNames.forEach(function(name) {
      const card = document.createElement("a");
      card.href = "#";
      card.className = "card-link virtual-game";
      card.innerHTML = `
        <div class="thumb">
          <div class="skeleton"></div>
        </div>
        <div class="card-body">
          <p class="card-title">${name}</p>
          <p class="card-sub">加载中…</p>
        </div>
      `;
      grid.appendChild(card);
    });

    // 给所有虚拟游戏绑定点击提示
    document.addEventListener("click", function(e) {
      const isVirtual = e.target.closest(".virtual-game");
      if (isVirtual) {
        e.preventDefault();
        alert("该游戏正在加载中，请稍后再试！");
      }
    });
  })();
</script>
</body>
</html>
